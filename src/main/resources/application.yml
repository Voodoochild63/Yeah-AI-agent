server:
  port: 8123
  servlet:
    context-path: /api
  error:
    # 规划失败时把原因带回响应，前端不再只看到空的 500
    include-message: always
# springdoc-openapi config
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.yeah.yeahaiagent.controller
# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
# searchAPI
search-api:
  # 需要替换为你自己的 key
  api-key: 你的 API Key
serper:
  api-key: aca29742d1933b74fa6feeacab44bb230f69f50d
  base-url: https://google.serper.dev
yeah:
  upstream:
    permits-per-second: 5
    acquire-timeout: 3s
    skeleton-ttl: 10m
# 修改日志级别，查看 Spring AI 更多调用细节
logging:
  level:
    org.springframework.ai: DEBUG