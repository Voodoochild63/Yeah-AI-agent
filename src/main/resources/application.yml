    model:
      embedding: none
    openai:
      api-key: AQ.Ab8RN6JENZ-BO0x7qGxXmZTQs2k7c54ovMEAuB047GPog8JM2A
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      chat:
        options:
          model: gemini-3.6-flash
      # Gemini OpenAI 兼容端点不支持 embedding 路由，已改为本地关键词检索
      # embedding:
