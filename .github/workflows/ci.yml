name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-build:
    name: Backend compile and test
    runs-on: ubuntu-latest
    env:
      AI_MOCK_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: test
      SPRING_AI_OPENAI_API_KEY: ci-dummy-openai-key
      SPRING_AI_OPENAI_BASE_URL: https://example.invalid/v1
      SERPER_API_KEY: ""
      SEARCH_API_API_KEY: ci-dummy-search-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Compile, test, and verify
        run: ./mvnw -B clean verify

  frontend-build:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yeah-ai-agent-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: yeah-ai-agent-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and production build
        run: npm run build
